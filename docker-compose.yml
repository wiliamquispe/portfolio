# Sirve ./site con nginx, solo en la interfaz local. El puerto sale de .env (APP_PORT), que no se versiona.
services:
  web:
    image: nginx:1.27-alpine
    container_name: portfolio-landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./ops/nginx:/etc/nginx/conf.d:ro   # carpeta (no un fichero): sobrevive a git pull
