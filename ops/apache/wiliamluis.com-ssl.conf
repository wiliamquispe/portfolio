# Puerto 443: TLS con el certificado de Let's Encrypt. Marcador: __PORT__
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName wiliamluis.com
    ServerAlias www.wiliamluis.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/wiliamluis.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wiliamluis.com/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:__PORT__/
    ProxyPassReverse / http://127.0.0.1:__PORT__/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/portfolio_error.log
    CustomLog ${APACHE_LOG_DIR}/portfolio_access.log combined
</VirtualHost>
</IfModule>
