# Borde con HAProxy en modo TCP, enrutando por SNI (sin descifrar). Ajusta APP_HOST y APP_TLS_PORT al Apache que termina TLS.
# 1) En el frontend TCP del puerto 443, junto a las demás ACL:
acl host_portfolio req.ssl_sni -i wiliamluis.com
acl host_portfolio req.ssl_sni -i www.wiliamluis.com
# 2) Junto a los demás use_backend:
use_backend https_portfolio if host_portfolio
# 3) Un backend nuevo, con la misma forma que los existentes:
backend https_portfolio
    mode tcp
    option ssl-hello-chk
    server app APP_HOST:APP_TLS_PORT check
# Validar con `haproxy -c -f <config>` y recargar con `reload` (no `restart`). Haz copia de seguridad de la config antes.
