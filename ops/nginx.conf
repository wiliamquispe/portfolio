# nginx dentro del contenedor: sólo estático. Cabeceras de seguridad y caché.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    location ~ /\. { return 404; }

    # lo que cambia con cada despliegue se revalida siempre
    location ~* \.(html|css|js|xml|txt)$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    # fuentes e imágenes casi nunca cambian
    location ~* \.(woff2|jpg|jpeg|png|pdf)$ { add_header Cache-Control "public, max-age=2592000" always; try_files $uri =404; }

    location / { try_files $uri $uri/ =404; }
}
